<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astral R dash</title>
  <style>
    @font-face {
      font-family: Overpass;
      src: url("/ui/common/Overpass/Overpass-VariableFont_wght.ttf");
      font-weight: 100 900;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080a0c;
      color: #f6f8fa;
      font-family: Overpass, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    main {
      --mode-color: #bbb;
      --cyan: #00ccff;
      --yellow: #fff68f;
      --red: #ff2701;
      --line: #596169;
      position: relative;
      height: 100vh;
      padding: 3vh 4vw;
      display: grid;
      grid-template-rows: 12% 1fr;
    }
    [hidden] { display: none; }
    main::before {
      content: "";
      position: absolute;
      top: calc(14.28vh - 2px);
      left: 4vw;
      right: 4vw;
      border-bottom: 2px solid var(--line);
    }
    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 4.1vw;
      font-weight: 740;
      line-height: 1;
    }
    #context { color: var(--mode-color); font-size: 3.4vw; }
    [data-page=stage] header > * {
      background: #080a0c;
      text-box: trim-both cap alphabetic;
      padding: .19em .8vw;
      border-radius: 1vw;
    }
    [data-page=map] header, [data-page=boost] header, [data-page=launchPreset] header, [data-page=launch] header {
      justify-content: center;
      font-size: 6.25vw;
    }
    [data-page=map] #context, [data-page=boost] #context, [data-page=launchPreset] #context, [data-page=launch] #context { display: none; }
    .page { display: none; }
    [data-page=road] #road { display: grid; grid-template-rows: 1fr 26.14%; }
    .readouts, footer { display: flex; gap: 3vw; }
    .readouts { padding: 3vh 0; }
    .field { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .field span { color: #bcc5ca; font-size: 2.9vw; font-weight: 650; line-height: 1.15; }
    .field b { font-size: 6.5vw; line-height: 1.04; font-weight: 730; }
    #primary, footer .field { flex: 1; }
    #primary b { font-size: 19vw; letter-spacing: -.035em; }
    aside {
      width: 35%;
      display: grid;
      grid-template-rows: 1fr 1fr;
      padding-left: 3vw;
      border-left: 1px solid #465058;
    }
    footer { border-top: 2px solid var(--line); }
    footer .field b { font-size: 5.8vw; }
    [data-page=stage] #stage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: 18% 17.5% 29% 17.5% 18%;
    }
    .stage-readings {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 10vh;
      text-align: center;
      font-size: 5.4vw;
      line-height: .7;
    }
    /* Center the visible Overpass capitals and numerals within each line. */
    .stage-readings > * { transform: translateY(.1em); }
    .gear-label { color: #bcc5ca; font-weight: 650; }
    #stageGear { font-size: 20vw; font-weight: 760; }
    #stageRPM { transform: translateY(.14em); }
    #stage.cyan .outer { background: var(--cyan); }
    #stage.yellow .middle { background: var(--yellow); }
    #stage.yellow .gear-label, #stage.yellow #stageRPM { color: #202428; }
    #stage.red .inner { background: var(--red); }
    [data-page=map] #adjust, [data-page=boost] #adjust, [data-page=launchPreset] #adjust {
      display: block;
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(calc(-50% + .1em));
      text-align: center;
      font-weight: 740;
      font-size: 19vw;
      line-height: 1;
    }
    /* Balance the side bearings of the number and the final r in mBar. */
    [data-page=boost] #adjust { left: -.03em; }
    [data-page=launch] #launch {
      position: absolute;
      left: 0;
      top: 28%;
      bottom: 17%;
      width: 100%;
      display: grid;
      grid-template-columns: 59% 41%;
      font-weight: 740;
      line-height: 1;
      text-align: center;
    }
    #lcPreset { display: grid; place-items: center; font-size: 23vw; }
    #launch.lit #lcPreset { background: var(--red); }
    #lcInfo {
      border-left: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      font-size: 9vw;
    }
    #lcALS:empty { display: none; }
  </style>
</head>
<body>
  <main hidden>
    <header><strong id="heading"></strong><span id="context"></span></header>
    <section id="road" class="page">
      <div class="readouts">
        <div class="field" id="primary"><span id="speedLabel">SPEED_km/h</span><b id="speed"></b></div>
        <aside>
          <div class="field"><span>GEAR</span><b id="roadGear"></b></div>
          <div class="field"><span>RPM</span><b id="roadRPM"></b></div>
        </aside>
      </div>
      <footer>
        <div class="field"><span>COOLANT_°C</span><b id="coolant"></b></div>
        <div class="field"><span>FUEL_L</span><b id="fuel"></b></div>
      </footer>
    </section>
    <section id="stage" class="page">
      <div class="outer"></div>
      <div class="middle"></div>
      <div class="inner"></div>
      <div class="middle"></div>
      <div class="outer"></div>
      <div class="stage-readings">
        <span class="gear-label">GEAR</span>
        <b id="stageGear"></b>
        <b id="stageRPM"></b>
      </div>
    </section>
    <strong id="adjust" class="page"></strong>
    <section id="launch" class="page">
      <b id="lcPreset"></b>
      <div id="lcInfo"><b id="lcALS"></b><b id="lcLimit"></b></div>
    </section>
  </main>
  <script>
    "use strict";
    const panel = document.querySelector("main");
    const nodes = Object.fromEntries(Array.from(panel.querySelectorAll("[id]"), el => [el.id, el]));
    const headings = {road: "ROAD", stage: "STAGE", map: "ENGINE MAP", boost: "BOOST", launchPreset: "LAUNCH CONTROL", launch: "LAUNCH READY"};
    let speedScale = 3.6;
    let overlay, overlayUntil = 0;

    function setup(settings) {
      const imperial = settings.uiUnitLength === "imperial";
      nodes.speedLabel.textContent = imperial ? "SPEED_mph" : "SPEED_km/h";
      speedScale = imperial ? 2.236936 : 3.6;
    }

    function updateMode(mode) {
      panel.style.setProperty("--mode-color", "#" + mode.modeColor);
    }

    // genericGauges delivers these messages when the driver operates a selector.
    function messageQueue(message) {
      if (message.text === "map" || message.text === "boost" || message.text === "launchPreset") {
        overlay = message.text;
        overlayUntil = performance.now() + message.durationSec * 1000;
      }
    }

    function write(node, value) {
      const text = String(value);
      if (node.textContent !== text) node.textContent = text;
    }

    function updateData({electrics: e}) {
      const map = e.engineMapNumber;
      panel.hidden = !e.ignitionLevel || !map;
      if (panel.hidden || e.launchArmed || performance.now() >= overlayUntil) overlay = null;
      if (panel.hidden) return;

      const page = e.launchArmed ? "launch" : overlay || (map === 1 ? "road" : "stage");
      if (panel.dataset.page !== page) {
        panel.dataset.page = page;
        write(nodes.heading, headings[page]);
      }
      const gear = e.gearIndex < 0 ? "R" : e.gearIndex || "N";
      switch (page) {
        case "road":
          write(nodes.context, "MAP " + map);
          write(nodes.speed, Math.round(Math.abs(e.wheelspeed) * speedScale));
          write(nodes.roadGear, gear);
          write(nodes.roadRPM, Math.round(e.rpm));
          write(nodes.coolant, Math.round(e.watertemp));
          write(nodes.fuel, e.fuelVolume.toFixed(1));
          break;
        case "stage":
          write(nodes.context, "MAP " + map);
          write(nodes.stageGear, gear);
          write(nodes.stageRPM, Math.round(e.rpm));
          nodes.stage.classList.toggle("cyan", !!e.led0);
          nodes.stage.classList.toggle("yellow", !!e.led1);
          nodes.stage.classList.toggle("red", !!e.led2);
          break;
        case "map":
          write(nodes.adjust, "MAP " + map);
          break;
        case "boost":
          write(nodes.adjust, -e.boostTrimMbar + " mBar");
          break;
        case "launchPreset":
          write(nodes.adjust, "LC " + e.launchPreset);
          break;
        case "launch":
          nodes.launch.classList.toggle("lit", !!e.launchLight);
          write(nodes.lcPreset, "LC " + e.launchPreset);
          write(nodes.lcALS, e.engineMapALS < 0 ? "" : e.engineMapALS === 0 ? "ALS OFF" : "ALS " + e.engineMapALS);
          write(nodes.lcLimit, e.launchTargetRPM);
          break;
      }
    }
  </script>
</body>
</html>
